name: Deploy Radar Learning Lab

on:
  push:
    branches:
      - learning-engine-corpus-v0
    paths:
      - "learning_lab/**"
      - ".github/workflows/learning-lab-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-learning-lab-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the isolated Learning Lab branch
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the reader-only static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: learning_lab

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
